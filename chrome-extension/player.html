<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reformationsbibeln ljudspelare</title>
  <link rel="stylesheet" href="player.css">
  <script defer src="lib/books.js"></script>
  <script defer src="lib/core.js"></script>
  <script defer src="player.js"></script>
</head>
<body>
  <main class="player" aria-label="Bibelns ljudspelare">
    <div class="topline">
      <div class="identity"><span class="eyebrow">REFORMATIONSBIBELN · LJUD</span><strong id="chapter">Läser kapitel…</strong></div>
      <div class="options">
        <button id="follow" class="pill" aria-pressed="true" title="Rulla sidan till den upplästa versen">Följ vers: på</button>
        <button id="loop" class="pill" aria-pressed="false" title="Växla mellan ingen loop, kapitel och aktuell vers">Loop: av</button>
        <label class="speed-label">Hastighet<select id="speed" aria-label="Uppspelningshastighet"><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></label>
      </div>
    </div>
    <div class="transport">
      <div class="buttons"><button id="previous" class="icon" aria-label="Föregående vers" title="Föregående vers" disabled>‹</button><button id="play" class="play" aria-label="Spela" title="Spela" disabled><span id="play-symbol" aria-hidden="true">▶</span></button><button id="next" class="icon" aria-label="Nästa vers" title="Nästa vers" disabled>›</button></div>
      <div class="scrubber">
        <div class="timeline-labels"><span id="verse">Vers –</span><span id="time">0:00 / 0:00</span></div>
        <div id="seek-wrap" class="seek-wrap"><div id="tooltip" class="tooltip" role="tooltip" hidden>Vers 1</div><div id="ticks" class="ticks" aria-hidden="true"></div><input id="seek" type="range" min="0" max="1" step="0.05" value="0" aria-label="Spola i kapitlet" aria-valuetext="Ljudet laddas" disabled></div>
      </div>
      <label class="volume-label"><span aria-hidden="true">◖</span><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volym"></label>
    </div>
    <div class="statusline"><span id="status" role="status" aria-live="polite">Förbereder ljudet…</span><span id="download" aria-live="off"></span><button id="retry" hidden>Försök igen</button></div>
    <progress id="progress" max="1" value="0" aria-label="Kapitlets ljudfiler hämtas"></progress>
  </main>
</body>
</html>
