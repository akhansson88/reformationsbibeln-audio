name: Generate verse audio
run-name: Verse audio · ${{ inputs.request_id || inputs.books || 'Entire Bible' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional dispatch tracking ID
        type: string
      books:
        description: Comma-separated books (English, Swedish, or numbers)
        default: John
        type: string
      chapters:
        description: Chapters/ranges, blank for all chapters of selected books
        default: '1'
        type: string
      entire:
        description: Entire Bible (leave books and chapters blank)
        default: false
        type: boolean
      replace_legacy:
        description: Hide and replace legacy OpenAI chapters with the selected voice (ignores book/chapter selection)
        default: false
        type: boolean
      overwrite:
        description: Overwrite existing audio for selected chapters
        default: false
        type: boolean
      revision:
        description: Optional overwrite resume ID; normally leave blank
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: bible-audio-generation
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  BOOKS: ${{ inputs.books }}
  CHAPTERS: ${{ inputs.chapters }}
  ENTIRE: ${{ inputs.entire }}
  REPLACE_LEGACY: ${{ inputs.replace_legacy }}
  OVERWRITE: ${{ inputs.overwrite }}
  REVISION: ${{ inputs.revision }}
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Save migration and hide legacy chapters
        id: prepare
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$REPLACE_LEGACY" == "true" ]]; then
            python audio.py prepare --replace-legacy
            git add catalog.json migration-jessica.json
            if ! git diff --cached --quiet; then
              git commit -m 'Hide legacy chapters and save voice migration'
              git push origin HEAD:main
            fi
          fi
      - name: Generate and upload individual verses
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        shell: bash
        run: |
          args=(--books "$BOOKS" --chapters "$CHAPTERS")
          if [[ "$ENTIRE" == "true" ]]; then args+=(--all); fi
          if [[ "$REPLACE_LEGACY" == "true" ]]; then args=(--replace-legacy); fi
          if [[ "$OVERWRITE" == "true" ]]; then args+=(--overwrite); fi
          python audio.py estimate "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          python audio.py generate "${args[@]}" --revision "$REVISION" --max-seconds 18000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-audio
          path: generated/pending/
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-chapters
          path: generated/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Publish every completed chapter even after credits run out
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        shell: bash
        run: |
          python audio.py publish
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete audio chapters'
            git push origin HEAD:main
          fi
